
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Flake8 Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: flake8 src/ tests/
        
  tests:
      name: Pytest
      runs-on: ubuntu-latest
      steps:
        - name: Run Pytest
          run: pytest